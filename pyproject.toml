[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdog"
version = "0.1.1"
description = "Lightweight evaluation toolkit for AI agents — test tool use, grounding, safety, and efficiency before production"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sai Teja Erukude" }]
license = { file = "LICENSE" }
keywords = ["llm", "ai", "agent", "evaluation", "testing", "rag", "tool-use", "safety", "prompt-injection", "evals"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/SaiTeja-Erukude/agentdog"
Repository = "https://github.com/SaiTeja-Erukude/agentdog"
"Bug Tracker" = "https://github.com/SaiTeja-Erukude/agentdog/issues"
Changelog = "https://github.com/SaiTeja-Erukude/agentdog/releases"

[project.optional-dependencies]
llm-judge = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
agentdog = "agentdog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentdog"]

[tool.hatch.build.targets.sdist]
include = [
    "agentdog/",
    "tests/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
